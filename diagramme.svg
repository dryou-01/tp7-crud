<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Arial,sans-serif" font-size="14">
<rect width="900" height="420" fill="#fff"/>
<text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold">Diagramme entité-relation : Centre de formation</text>
<g stroke="#1f3a68" stroke-width="2" fill="#eef2fa">
<rect x="40" y="70" width="240" height="170"/><rect x="330" y="70" width="240" height="140"/><rect x="620" y="70" width="240" height="170"/>
</g>
<g fill="#1f3a68"><rect x="40" y="70" width="240" height="32"/><rect x="330" y="70" width="240" height="32"/><rect x="620" y="70" width="240" height="32"/></g>
<g fill="#fff" font-weight="bold" text-anchor="middle"><text x="160" y="92">ETUDIANTS</text><text x="450" y="92">FORMATIONS</text><text x="740" y="92">MODULES</text></g>
<g fill="#222">
<text x="55" y="130" font-weight="bold">PK  id_etudiant (INT)</text><text x="55" y="155">nom (VARCHAR)</text><text x="55" y="180">prenom (VARCHAR)</text><text x="55" y="205">email (VARCHAR, UNIQUE)</text><text x="55" y="230" fill="#c0392b" font-weight="bold">FK  id_formation (INT)</text>
<text x="345" y="130" font-weight="bold">PK  id_formation (INT)</text><text x="345" y="155">titre (VARCHAR)</text><text x="345" y="180">duree_mois (INT)</text><text x="345" y="205">description (TEXT)</text>
<text x="635" y="130" font-weight="bold">PK  id_module (INT)</text><text x="635" y="155">intitule (VARCHAR)</text><text x="635" y="180">volume_horaire (INT)</text><text x="635" y="205" fill="#c0392b" font-weight="bold">FK  id_formation (INT)</text>
</g>
<g stroke="#c0392b" stroke-width="2" fill="none">
<path d="M280 150 H330"/><path d="M570 150 H620"/>
</g>
<g font-weight="bold" fill="#c0392b" font-size="16">
<text x="286" y="142">N</text><text x="312" y="168">1</text><text x="578" y="168">1</text><text x="602" y="142">N</text>
</g>
<text x="305" y="125" text-anchor="middle" font-size="12">est inscrit</text>
<text x="595" y="125" text-anchor="middle" font-size="12">contient</text>
<g font-size="13" fill="#333">
<text x="40" y="290">Relation 1 : une FORMATION (1) accueille plusieurs ETUDIANTS (N) ;</text>
<text x="40" y="312">  un ETUDIANT est rattaché à une seule FORMATION.  → FK id_formation dans ETUDIANTS</text>
<text x="40" y="344">Relation 2 : une FORMATION (1) contient plusieurs MODULES (N) ;</text>
<text x="40" y="366">  un MODULE appartient à une seule FORMATION.  → FK id_formation dans MODULES</text>
<text x="40" y="398">Règle : la clé étrangère se place toujours du côté « N » de la relation.</text>
</g>
</svg>
